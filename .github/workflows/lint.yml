name: Lint
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build Dashboard Frontend
        working-directory: dashboard
        run: |
          npm install
          npm run build
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0 run --timeout=5m

  eslint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install & Lint
        working-directory: dashboard
        run: |
          npm install
          npm run lint

  flake8:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Flake8 & Black
        run: |
          pip install flake8 black
          flake8 scripts sdk/python
          black --check scripts sdk/python
