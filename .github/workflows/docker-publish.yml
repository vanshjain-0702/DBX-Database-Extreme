name: Docker Publish

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push DBX Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.engine
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dbx-engine:latest,ghcr.io/${{ github.repository_owner }}/dbx-engine:${{ github.event.release.tag_name }}
          
      - name: Build and push DBX Orchestrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dbx-orchestrator:latest,ghcr.io/${{ github.repository_owner }}/dbx-orchestrator:${{ github.event.release.tag_name }}
