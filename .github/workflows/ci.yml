name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Dashboard
      working-directory: ./dashboard
      run: |
        npm install
        npm run build

    - name: Install dependencies
      run: go mod download

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

    - name: Test
      run: go test -v -race ./...

    - name: Build DBX Server
      run: go build -o bin/dbx-server ./cmd/dbx-server

    - name: Build DBX Orchestrator
      run: go build -o bin/dbx-orchestrator ./cmd/dbx-orchestrator

    - name: Docker Build Check
      run: |
        docker build -t dbx/dbx:test -f deploy/Dockerfile .
