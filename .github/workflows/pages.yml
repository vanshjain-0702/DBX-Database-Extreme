# Publishes website/ to the gh-pages branch.
# Then: Settings → Pages → Deploy from a branch → gh-pages → / (root).
# GitHub Pages stays 404 while this repository is private on a Free plan.
# Open website/index.html locally, or make the repo public / use GitHub Pro.
name: Deploy site

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish website to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          force_orphan: true
          enable_jekyll: false
