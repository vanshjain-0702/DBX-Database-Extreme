name: Build and Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build Dashboard Frontend
        working-directory: ./dashboard
        run: |
          npm install
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            go test -timeout 15m -race -coverprofile=coverage.out ./...
          else
            go test -timeout 15m -coverprofile=coverage.out ./...
          fi

      - name: Build server
        run: go build -o bin/dbx-server ./cmd/dbx-server

      - name: Build orchestrator
        run: go build -o bin/dbx-orchestrator ./cmd/dbx-orchestrator

      - name: Archive server
        shell: bash
        run: |
          set -euo pipefail
          if [ -f bin/dbx-server.exe ]; then
            tar -czf "dbx-server-${{ matrix.os }}.tar.gz" bin/dbx-server.exe
          else
            tar -czf "dbx-server-${{ matrix.os }}.tar.gz" bin/dbx-server
          fi

  release-gates:
    name: Production release gates (Linux)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: Coverage floors
        run: python3 scripts/ci/check-coverage.py
      - name: Density isolation
        run: go test -count=1 -timeout 3m ./internal/engine/ ./internal/query/ ./internal/security/ ./internal/orchestrator/ -run 'Density|NoisyNeighbor|Quota|BackupRestore|Hibernate|TenantUsage'
      - name: Vector smoke harness
        run: |
          set -euo pipefail
          go run ./cmd/dbx-vector-benchmark -count 25000 -dim 128 -queries 10 -k 10 | tee bench.txt
          python3 scripts/ci/check-vector-gates.py bench.txt
