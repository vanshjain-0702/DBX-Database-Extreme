name: Build and Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Test (OS Matrix)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build Dashboard Frontend
        working-directory: ./dashboard
        run: |
          npm install
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (Non-Windows)
        if: runner.os != 'Windows'
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test -v "-coverprofile=coverage.out" ./...

      - name: Build server
        run: go build -o bin/dbx-server ./cmd/dbx-server

      - name: Build orchestrator
        run: go build -o bin/dbx-orchestrator ./cmd/dbx-orchestrator

      - name: Archive server
        shell: bash
        run: |
          set -euo pipefail
          if [ -f bin/dbx-server.exe ]; then
            tar -czf "dbx-server-${{ matrix.os }}.tar.gz" bin/dbx-server.exe
          else
            tar -czf "dbx-server-${{ matrix.os }}.tar.gz" bin/dbx-server
          fi

  release-gates:
    name: Production release gates (Linux)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build Dashboard Frontend
        working-directory: ./dashboard
        run: |
          npm install
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: Race detector
        run: go test -race ./...
      - name: Coverage floors
        run: |
          set -euo pipefail
          check() {
            pkg="$1"
            min="$2"
            out=$(go test -cover "$pkg")
            echo "$out"
            pct=$(echo "$out" | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p' | tail -1)
            python3 -c "import sys; pct=float(sys.argv[1]); minv=float(sys.argv[2]); pkg=sys.argv[3];
print(f'{pkg} coverage={pct}% min={minv}%');
sys.exit(0 if pct>=minv else 1)" "$pct" "$min" "$pkg"
          }
          check ./internal/protocol/ 80
          check ./internal/persistence/ 70
          check ./internal/query/ 65
          check ./internal/engine/ 45
      - name: Density isolation
        run: go test -count=1 -timeout 2m ./internal/engine/ ./internal/query/ ./internal/security/ -run 'Density|NoisyNeighbor|Quota'
      - name: Vector certification harness
        run: |
          set -euo pipefail
          go run ./cmd/dbx-vector-benchmark -count 100000 -dim 128 -queries 25 -k 10 | tee bench.txt
          python3 -c 'import re,sys
text=open("bench.txt").read()
def num(name):
    m=re.search(name+r"=([0-9.]+)", text)
    if not m: raise SystemExit("missing "+name)
    return float(m.group(1))
ingest,p50,p95,p99,recall,p05=num("ingest_vectors_per_sec"),num("search_p50"),num("search_p95"),num("search_p99"),num("recall_mean"),num("recall_p05")
print("parsed",ingest,p50,p95,p99,recall,p05)
failed=[]
if ingest<1500: failed.append("ingest")
if p50>12: failed.append("p50")
if p95>20: failed.append("p95")
if p99>30: failed.append("p99")
if recall<0.90: failed.append("recall")
if p05<0.70: failed.append("p05")
if failed: raise SystemExit("failed gates: "+",".join(failed))'
