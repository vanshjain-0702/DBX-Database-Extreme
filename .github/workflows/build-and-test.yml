name: Build and Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Test (OS Matrix)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
         node-version: '20' # Or your preferred version

      - name: Build Dashboard Frontend
        working-directory: ./dashboard # Adjust this to where your package.json lives
        run: |
         npm install
         npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test (Non-Windows)
        if: runner.os != 'Windows'
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test -v -coverprofile=coverage.out ./...

      - name: Build server
        run: go build -o bin/dbx-server ./cmd/dbx-server

      - name: Build orchestrator
        run: go build -o bin/dbx-orchestrator ./cmd/dbx-orchestrator

      - name: Archive server
        run: |
         tar -czf dbx-server-${{ matrix.os }}.tar.gz bin/dbx-server
      
     
