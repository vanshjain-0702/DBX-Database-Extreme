[project]
name = "dbx"
version = "1.2.0"
description = "RESP and control-plane clients for DBX"
requires-python = ">=3.10"
dependencies = ["redis>=5"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.10"]
all = ["langchain-core>=0.2", "llama-index-core>=0.10"]

[tool.setuptools]
py-modules = ["dbx", "langchain_dbx", "llamaindex_dbx"]
