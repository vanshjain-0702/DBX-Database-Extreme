apiVersion: v1
kind: Service
metadata:
  name: dbx-internal
  labels:
    app: dbx-orchestrator
spec:
  clusterIP: None # Headless service for Raft peer discovery
  ports:
  - port: 7000
    name: raft
    targetPort: 7000
  - port: 8000
    name: http
    targetPort: 8000
  selector:
    app: dbx-orchestrator

---
apiVersion: v1
kind: Service
metadata:
  name: dbx-public
  labels:
    app: dbx-orchestrator
  annotations:
    # AWS ALB Ingress configuration would go here
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    name: http
    targetPort: 8000
  selector:
    app: dbx-orchestrator
