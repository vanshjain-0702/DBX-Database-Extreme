version: "3.9"

services:
  dbx-orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: dbx-orchestrator
    ports:
      - "8000:8000"
      - "6380:6380"
    environment:
      DBX_ADMIN_PASSWORD: ${DBX_ADMIN_PASSWORD:?required}
      DBX_JWT_SECRET: ${DBX_JWT_SECRET:?required}
      DBX_INTERNAL_API_TOKEN: ${DBX_INTERNAL_API_TOKEN:?required}
      DBX_NODE_MEMORY_BUDGET: ${DBX_NODE_MEMORY_BUDGET:-8gb}
      DBX_DEFAULT_PASSWORD: ${DBX_DEFAULT_PASSWORD:-}
      DBX_DATA_DIR: /data
      DBX_ISOLATION_MODE: ${DBX_ISOLATION_MODE:-strict}
      DBX_KEK: ${DBX_KEK:?required}
    volumes:
      - dbx-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  dbx-data:
    driver: local
