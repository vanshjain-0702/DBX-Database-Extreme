# v1 is a single orchestrator process. Do not scale this above 1.
replicaCount: 1

image:
  repository: ghcr.io/vanshjain-0702/dbx-orchestrator
  pullPolicy: IfNotPresent
  tag: "v1.1.0"

nameOverride: ""
fullnameOverride: ""

memoryBudget: "8gb"

persistence:
  size: 100Gi

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

isolationMode: strict

autoscaling:
  enabled: false
