apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dbx-orchestrator
  labels:
    app: dbx-orchestrator
spec:
  serviceName: "dbx-internal"
  replicas: 1
  selector:
    matchLabels:
      app: dbx-orchestrator
  template:
    metadata:
      labels:
        app: dbx-orchestrator
    spec:
      serviceAccountName: dbx-orchestrator-sa
      containers:
      - name: orchestrator
        image: ghcr.io/dbx/dbx:latest
        imagePullPolicy: IfNotPresent
        args:
        - -insecure-http=true
        - -state-file=/dbx/data/tenants.json
        - -admin-file=/dbx/data/admin.json
        env:
        - name: DBX_DATA_DIR
          value: /dbx/data
        - name: DBX_NODE_MEMORY_BUDGET
          value: "8gb"
        - name: DBX_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dbx-control-plane
              key: jwt-secret
        - name: DBX_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dbx-control-plane
              key: admin-password
        - name: DBX_INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: dbx-control-plane
              key: internal-token
        - name: DBX_DEFAULT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dbx-control-plane
              key: engine-password
              optional: true
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 6380
          name: resp
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /dbx/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi
